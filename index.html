/* ---------- Tokens ---------- */
:root {
    --paper:      #faf9f6;
    --paper-dim:  #f1efe9;
    --ink:        #16232c;
    --ink-soft:   #4d5b63;
    --ink-faint:  #8a9299;
    --line:       #ddd8cc;
    --teal:       #2d5f61;
    --teal-dim:   #e8eeee;
    --gold:       #a9762f;

    --serif: "Source Serif 4", Georgia, serif;
    --sans:  "Inter", -apple-system, "Segoe UI", sans-serif;
    --mono:  "IBM Plex Mono", "SFMono-Regular", monospace;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
    margin: 0;
    font-family: var(--sans);
    color: var(--ink-soft);
    background: var(--paper);
    line-height: 1.65;
    font-size: 16px;
}

h1, h2, h3 { font-family: var(--serif); color: var(--ink); font-weight: 600; }

a { color: var(--teal); }

::selection { background: var(--teal-dim); color: var(--ink); }

/* ---------- Layout shell ---------- */

.shell {
    display: flex;
    align-items: flex-start;
    max-width: 1180px;
    margin: 0 auto;
}

/* ---------- Sidebar ---------- */

.sidebar {
    width: 300px;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    height: 100vh;
    padding: 48px 36px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
}

.sidebar-photo {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    object-position: 50% 22%;
    border-radius: 3px;
    filter: grayscale(15%);
}

.sidebar h1 {
    font-size: 24px;
    margin: 22px 0 4px;
    line-height: 1.25;
}

.sidebar .role {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 28px;
}

.sidebar nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-bottom: auto;
    padding-bottom: 28px;
}

.sidebar nav a {
    text-decoration: none;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 7px 0;
    border-bottom: 1px solid transparent;
    width: fit-content;
}

.sidebar nav a:hover,
.sidebar nav a.active {
    color: var(--ink);
    border-bottom-color: var(--teal);
}

    display: flex;
